[package]
name = "tecla"
version = "0.1.0"
description = "A minimalist typing test for the terminal"
authors = ["Gabb-c <gdgabrieldacunha71@gmail.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
ratatui = "0.30.2"
color-eyre = "0.6.5"
unicode-segmentation = "1.13.3"
rand = "0.10.3"
serde_json = "1.0.154"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.1.8"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
must_use_candidate = "allow"
# usize -> f64 for wpm/accuracy; counts never approach 2^52
cast_precision_loss = "allow"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
